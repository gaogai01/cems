<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261117">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日巡查紀錄 - 尖山發電廠</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="css/style-daily.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<div id="loading">資料載入中...</div>

<div class="container" id="mainApp" style="display:none;">
    
    <div class="page-header">
        <div class="header-left">
            <h2>最新數據總覽</h2>
            <span class="date-pill" id="lastDatePill">...</span>
            <span id="dataStatus" role="status" aria-live="polite" style="font-size:0.8rem;color:#667085;"></span>
        </div>
        <div class="btn-group">
            <button class="btn-report" onclick="openReportModal()">📊 產生月報表</button>
            <button class="btn-log" onclick="openLogModal()">📋 產生工作日誌</button>
        </div>
    </div>
    
    <div class="group-container">
        <div class="system-group">
            <div class="group-header group-recycle">放流水系統</div>
            <div id="gridRecycle" class="inner-grid"></div>
        </div>
        <div class="system-group">
            <div class="group-header group-desalt">海淡機組</div>
            <div id="gridDesalt" class="inner-grid"></div>
        </div>
        <div class="system-group">
            <div class="group-header group-storage">儲水管理</div>
            <div id="gridStorage" class="inner-grid"></div>
        </div>
        <div class="system-group">
            <div class="group-header group-urea">尿素管理</div>
            <div id="gridUrea" class="inner-grid"></div>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-header">歷史趨勢分析</div>
        <div class="chart-controls">
            <label style="color:var(--text-main)">項目：</label>
            <select id="chartParam" onchange="updateLineChart()"></select>
            <label style="color:var(--text-main)">範圍：</label>
            <select id="timeRange" onchange="updateLineChart()">
                <option value="720">近 1 個月</option>
                <option value="2160" selected>近 1 季</option>
                <option value="4320">近半年</option>
                <option value="8760">近 1 年</option>
            </select>
        </div>
        <div class="chart-box">
            <canvas id="lineChart"></canvas>
        </div>
    </div>
</div>

<div id="logModal" class="modal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--text-main);">工作日誌產生器</h3>
            <span class="close-btn" onclick="closeLogModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="log-controls">
                <label style="color:var(--text-main)">日期：</label>
                <input type="date" id="logDate" style="padding:5px;">
                <button class="btn-log" onclick="generateLog()">生成</button>
            </div>
            <textarea id="logResult" placeholder="日誌將顯示於此..."></textarea>
            <div style="margin-top:10px; text-align:right;">
                <button class="btn-log" style="background:#007bff;" onclick="copyLog()">複製內容</button>
            </div>
        </div>
    </div>
</div>

<div id="reportModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--text-main);">海淡造水量月報表</h3>
            <span class="close-btn" onclick="closeReportModal()">&times;</span>
        </div>
        <div class="log-controls" style="padding: 0 10px;">
            <label style="color:var(--text-main)">選擇月份：</label>
            <input type="month" id="reportMonth" style="padding:5px;">
            <button class="btn-report" onclick="generateReport()">生成報表</button>
            <button class="btn-excel" onclick="exportExcel()">📥 匯出 Excel</button>
            <button class="btn-log" style="background:#6c757d;" onclick="printReport()">🖨️ 列印/PDF</button>
        </div>
        <div class="modal-body" id="reportContainer" style="background:white; color:black; padding:20px;">
            <div style="text-align:center; color:#888;">請選擇月份並點擊生成</div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzJzoU4IyAc6CeKydjbM8iYVyPMsFvMfoR_I50OT7vyNPpH7BZBjlWGEt_DdnUtlUw/exec"; 
    
    let rawData = null;
    let lineChart = null;
    let lastDataFingerprint = "";
    let fetchInProgress = false;
    const DAILY_CACHE_KEY = "cems_daily_records_cache_v1";

    function startApp() {
        document.getElementById('logDate').valueAsDate = new Date();
        document.getElementById('reportMonth').value = new Date().toISOString().slice(0, 7);

        // 先顯示上次成功載入的資料，背景再抓最新內容，減少每次開頁的等待。
        try {
            const cached = JSON.parse(localStorage.getItem(DAILY_CACHE_KEY) || "null");
            if (cached && cached.payload && Array.isArray(cached.payload.data) && cached.payload.data.length) {
                renderDailyData(cached.payload);
                lastDataFingerprint = getDataFingerprint(cached.payload);
                const cacheTime = cached.savedAt ? new Date(cached.savedAt) : null;
                setDataStatus(cacheTime ? `先顯示快取資料（${cacheTime.toLocaleTimeString()}），正在更新…` : "先顯示快取資料，正在更新…");
            }
        } catch (e) {
            console.warn("讀取每日紀錄快取失敗：", e);
        }

        fetchData();
        setInterval(() => fetchData(), 5 * 60 * 1000);
    }

    function getDataFingerprint(json) {
        return JSON.stringify([json.headers, json.units, json.limits, json.data]);
    }

    function setDataStatus(message) {
        const status = document.getElementById('dataStatus');
        if (status) status.textContent = message;
    }

    function renderDailyData(json) {
        rawData = json;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        renderAllGroups();
        initDropdown();
        updateLineChart();
    }

    async function fetchData() {
        if (fetchInProgress) return;
        fetchInProgress = true;
        const loading = document.getElementById('loading');
        if (!rawData && loading) loading.textContent = "資料載入中…";

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        try {
            const res = await fetch(API_URL + "?mode=daily&_=" + Date.now(), {
                cache: "no-store",
                signal: controller.signal
            });
            if (!res.ok) throw new Error(`資料服務回應 ${res.status}`);
            const json = await res.json();
            if (json.error) throw new Error(json.error);
            if (!Array.isArray(json.data) || !json.data.length) throw new Error("資料來源沒有可顯示的紀錄");

            const fingerprint = getDataFingerprint(json);
            if (fingerprint !== lastDataFingerprint) {
                renderDailyData(json);
                lastDataFingerprint = fingerprint;
                try {
                    localStorage.setItem(DAILY_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), payload: json }));
                } catch (e) {
                    console.warn("儲存每日紀錄快取失敗：", e);
                }
            }
            setDataStatus(`資料已更新 ${new Date().toLocaleTimeString()}`);
        } catch (e) {
            console.error("每日紀錄載入失敗：", e);
            const message = e.name === "AbortError" ? "資料來源逾時" : (e.message || "網路連線失敗");
            if (rawData) {
                setDataStatus(`仍顯示上次資料；更新失敗：${message}`);
            } else if (loading) {
                loading.innerHTML = `資料載入失敗：${escapeHtml(message)}。<button type="button" onclick="fetchData()">重新載入</button>`;
            }
        } finally {
            clearTimeout(timeoutId);
            fetchInProgress = false;
        }
    }

    function renderAllGroups() {
        let latestRow = null;
        const today = new Date(); today.setHours(23, 59, 59, 999);

        for (let i = rawData.data.length - 1; i >= 0; i--) {
            const rowDateStr = rawData.data[i][0];
            const rowDataVal = rawData.data[i][2];
            if (rowDateStr && rowDataVal) {
                const rowDate = new Date(rowDateStr);
                if (rowDate <= today) { latestRow = rawData.data[i]; break; }
            }
        }
        
        if (!latestRow) return;
        
        let dateStr = latestRow[0];
        if(dateStr.includes('T')) dateStr = dateStr.split('T')[0];
        document.getElementById('lastDatePill').innerHTML = `${dateStr} <span class="date-note">(人工輸入)</span>`;

        const headerMap = {};
        rawData.headers.forEach((h, i) => { if(h) headerMap[h.trim()] = i; });

        const groups = {
            "gridRecycle": { class: "recycle", items: ["回收水量"] },
            "gridDesalt":  { class: "desalt",  items: ["1號機造水量", "2號機造水量", "1號機海水壓力", "2號機海水壓力"] },
            "gridStorage": { class: "storage", items: ["15000公秉儲水位", "用水量"] },
            "gridUrea":    { class: "urea",    items: ["尿素比重", "尿素用量", "尿素庫存"] }
        };

        for (const [gridId, config] of Object.entries(groups)) {
            const container = document.getElementById(gridId);
            container.innerHTML = "";

            config.items.forEach(field => {
                const idx = headerMap[field];
                if (idx === undefined) return;

                const val = parseFloat(latestRow[idx]);
                const max = parseFloat(rawData.limits[idx]) || 100; 
                const unit = rawData.units[idx] || "";
                
                let displayVal = isNaN(val) ? "--" : val;
                let pct = isNaN(val) ? 0 : (val / max) * 100;
                if (pct > 100) pct = 100;

                let extraInfo = "";
                if (field === "15000公秉儲水位" && !isNaN(val)) {
                    let volume = (val * 2950).toLocaleString(undefined, {maximumFractionDigits: 0});
                    extraInfo = `換算: <span class="info-highlight">${volume}</span> 公秉`;
                }
                else if (field.includes("水量") || field.includes("用量")) {
                    let stats = calcHistoryStats(idx, 30);
                    extraInfo = `30日平均: <span class="info-highlight">${stats.avg.toFixed(1)}</span>`;
                }
                else if (field === "尿素比重" && !isNaN(val)) {
                    let conc = ((val - 1) * 1000 / 2.78).toFixed(1);
                    extraInfo = `濃度: <span class="info-highlight">${conc}%</span>`;
                }
                else {
                    extraInfo = `上限: ${max}`;
                }

                const card = document.createElement('div');
                card.className = `card ${config.class}`;
                card.innerHTML = `
                    <h3>${field}</h3>
                    <div class="data-row">
                        <span class="value">${displayVal}</span>
                        <span class="unit">${unit}</span>
                    </div>
                    <div class="gauge-container">
                        <div class="gauge-bar" style="width: ${pct}%"></div>
                    </div>
                    <div class="info-text">${extraInfo}</div>
                `;
                container.appendChild(card);
            });
        }
    }

    function calcHistoryStats(colIdx, days) {
        let sum = 0, count = 0;
        let validData = rawData.data.filter(row => row[0] && row[colIdx] && !isNaN(parseFloat(row[colIdx])));
        let start = Math.max(0, validData.length - days);
        for (let i = start; i < validData.length; i++) {
            let v = parseFloat(validData[i][colIdx]);
            sum += v; count++;
        }
        return { sum: sum, avg: count > 0 ? sum / count : 0 };
    }

    // --- 月報表產生器 ---
    function openReportModal() { document.getElementById('reportModal').style.display = 'block'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
    
    function generateReport() {
        const monthStr = document.getElementById('reportMonth').value;
        if (!monthStr) return alert("請選擇月份");
        
        const [year, month] = monthStr.split('-');
        const container = document.getElementById('reportContainer');
        container.innerHTML = "報表生成中...";

        const hMap = {}; rawData.headers.forEach((h, i) => { if(h) hMap[h.trim()] = i; });
        const getVal = (row, name) => { let v = parseFloat(row[hMap[name]]); return isNaN(v) ? 0 : v; };
        const getRaw = (row, name) => row[hMap[name]] || "";

        const monthData = rawData.data.filter(row => {
            let d = row[0].replace(/\//g, '-');
            return d.startsWith(monthStr);
        }).sort((a,b) => a[0].localeCompare(b[0]));

        if (monthData.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px;">無 ${year}年${month}月 資料</div>`;
            return;
        }

        let html = `
            <div class="report-title">尖山發電廠海水淡化廠造水量統計表</div>
            <div class="report-subtitle">月份: ${year}年${month}月</div>
            <table class="report-table">
                <thead>
                    <tr>
                        <th rowspan="3">日期</th>
                        <th rowspan="3">星期</th>
                        <th colspan="3">海淡造水量(噸)</th>
                        <th rowspan="3">當日<br>用水量<br>(噸)</th>
                        <th colspan="3">15000噸儲水槽</th>
                        <th colspan="4">蒸氣</th>
                        <th colspan="2">運轉機組數</th>
                        <th rowspan="3">海水入口<br>壓力(bar)</th>
                    </tr>
                    <tr>
                        <th rowspan="2">#1機</th>
                        <th rowspan="2">#2機</th>
                        <th rowspan="2">總計</th>
                        <th rowspan="2">液位<br>(m)</th>
                        <th rowspan="2">增減<br>(m)</th>
                        <th rowspan="2">儲水量<br>(噸)</th>
                        <th rowspan="2">溫度<br>(℃)</th>
                        <th rowspan="2">壓力<br>(bar)</th>
                        <th colspan="2">流量(T/H)</th>
                        <th rowspan="2">上午</th>
                        <th rowspan="2">下午</th>
                    </tr>
                    <tr>
                        <th>上午</th>
                        <th>下午</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let total1=0, total2=0, totalAll=0, totalUse=0;
        let count = 0;
        let prevLevel = null;

        const firstDayIndex = rawData.data.indexOf(monthData[0]);
        if (firstDayIndex > 0) {
            let prevRow = rawData.data[firstDayIndex - 1];
            prevLevel = parseFloat(prevRow[hMap["15000公秉儲水位"]]);
        }

        monthData.forEach(row => {
            const dateObj = new Date(row[0]);
            const day = dateObj.getDate();
            const weekDay = row[1];
            
            const v1 = getVal(row, "1號機造水量");
            const v2 = getVal(row, "2號機造水量");
            const vTotal = v1 + v2;
            const vUse = getVal(row, "用水量");
            const vLevel = getVal(row, "15000公秉儲水位");
            const vStock = (vLevel * 2950).toFixed(0);
            
            const stTemp = getRaw(row, "蒸氣溫度");
            const stPress = getRaw(row, "蒸氣壓力");
            const stFlowAM = getRaw(row, "上午蒸氣流量");
            const stFlowPM = getRaw(row, "下午蒸氣流量");
            
            const seaP1 = getVal(row, "1號機海水壓力");
            const seaP2 = getVal(row, "2號機海水壓力");
            const seaMax = Math.max(seaP1, seaP2);

            const boilerAM = getRaw(row, "上午鍋爐數").split('、').length || 0;
            const boilerPM = getRaw(row, "下午鍋爐數").split('、').length || 0;

            let diff = 0;
            if (prevLevel !== null && !isNaN(prevLevel)) { diff = vLevel - prevLevel; }
            prevLevel = vLevel; 

            total1 += v1; total2 += v2; totalAll += vTotal; totalUse += vUse;
            count++;

            html += `
                <tr>
                    <td>${month}月${day}日</td>
                    <td>${weekDay}</td>
                    <td>${v1}</td>
                    <td>${v2}</td>
                    <td>${vTotal}</td>
                    <td>${vUse}</td>
                    <td>${vLevel}</td>
                    <td style="color:${diff<0?'red':'black'}">${diff.toFixed(2)}</td>
                    <td>${Number(vStock).toLocaleString()}</td>
                    <td>${stTemp}</td>
                    <td>${stPress}</td>
                    <td>${stFlowAM}</td>
                    <td>${stFlowPM}</td>
                    <td>${boilerAM}</td>
                    <td>${boilerPM}</td>
                    <td>${seaMax}</td>
                </tr>
            `;
        });

        html += `
                <tr style="background:#f9f9f9; font-weight:bold;">
                    <td colspan="2">總計</td>
                    <td>${total1.toFixed(1)}</td>
                    <td>${total2.toFixed(1)}</td>
                    <td>${totalAll.toFixed(1)}</td>
                    <td>${totalUse.toFixed(1)}</td>
                    <td colspan="10"></td>
                </tr>
                <tr style="background:#f9f9f9; font-weight:bold;">
                    <td colspan="2">平均</td>
                    <td>${(total1/count).toFixed(1)}</td>
                    <td>${(total2/count).toFixed(1)}</td>
                    <td>${(totalAll/count).toFixed(1)}</td>
                    <td>${(totalUse/count).toFixed(1)}</td>
                    <td colspan="10"></td>
                </tr>
            </tbody>
        </table>
        `;
        container.innerHTML = html;
    }

    function printReport() {
        const content = document.getElementById('reportContainer').innerHTML;
        const printWindow = window.open('', '', 'height=600,width=800');
        printWindow.document.write('<html><head><title>月報表</title><style>table{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;} th,td{border:1px solid black;padding:4px;text-align:center;font-size:12px;} .report-title{text-align:center;font-size:18px;font-weight:bold;margin-bottom:5px;} .report-subtitle{text-align:center;margin-bottom:15px;}</style></head><body>');
        printWindow.document.write(content);
        printWindow.document.write('</body></html>');
        printWindow.document.close();
        printWindow.print();
    }

    // 新增：匯出 Excel 功能
    function exportExcel() {
        const table = document.querySelector('.report-table');
        if (!table) { alert("請先生成報表！"); return; }
        
        const monthStr = document.getElementById('reportMonth').value;
        const filename = `海淡造水量月報表_${monthStr}.xls`;
        
        const template = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
                <meta charset="UTF-8">
                <style>
                    table { border-collapse: collapse; }
                    th, td { border: 1px solid black; text-align: center; }
                    .num { mso-number-format:General; }
                    .text { mso-number-format:"\@"; }
                </style>
            </head>
            <body>
                <h3>尖山發電廠海水淡化廠造水量統計表 (${monthStr})</h3>
                ${table.outerHTML}
            </body>
            </html>`;

        const blob = new Blob([template], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    // --- 日誌與圖表 (同前) ---
    async function generateLog() {
        const dateStr = document.getElementById('logDate').value;
        if (!dateStr) return alert("請選擇日期");
        const targetDate = new Date(dateStr);
        const dateDisplay = (targetDate.getMonth()+1) + "月" + targetDate.getDate() + "日";
        document.getElementById('logResult').value = "資料讀取中...";

        const targetYMD = dateStr.replace(/\//g, '-'); 
        let targetRow = null, prevRow = null;
        for (let i = 0; i < rawData.data.length; i++) {
            let d = rawData.data[i][0].split(' ')[0].replace(/\//g, '-');
            if (d === targetYMD) { targetRow = rawData.data[i]; if (i > 0) prevRow = rawData.data[i-1]; break; }
        }
        if (!targetRow) { document.getElementById('logResult').value = "查無資料。"; return; }

        const hMap = {}; rawData.headers.forEach((h, i) => { if(h) hMap[h.trim()] = i; });
        const getVal = (name) => { let val = targetRow[hMap[name]]; return (val===""||val===undefined)?0:val; };

        const desalt1 = parseFloat(getVal("1號機造水量"))||0; const desalt2 = parseFloat(getVal("2號機造水量"))||0;
        const totalDesalt = desalt1 + desalt2; const waterUsed = getVal("用水量");
        const level = parseFloat(getVal("15000公秉儲水位"));
        const prevLevel = prevRow ? parseFloat(prevRow[hMap["15000公秉儲水位"]]) : level;
        const levelDiff = (level - prevLevel).toFixed(2);
        const levelTrend = levelDiff >= 0 ? "上升" : "下降";
        const realStock = (level * 2950).toFixed(1);
        const press1 = getVal("1號機海水壓力"); const press2 = getVal("2號機海水壓力");
        const amFlow = getVal("上午蒸氣流量"); const pmFlow = getVal("下午蒸氣流量");
        const amUnits = getVal("上午鍋爐數"); const pmUnits = getVal("下午鍋爐數"); 
        const amCount = amUnits ? amUnits.toString().split('、').length : 0;
        const pmCount = pmUnits ? pmUnits.toString().split('、').length : 0;

        let logText = `工作日期:${dateDisplay}。造水設備操作，#1海淡${desalt1>0?'運轉':'停機'}：造水量${desalt1}公噸;#2海淡${desalt2>0?'運轉':'停機'}：造水量${desalt2}公噸;當日總造水量${totalDesalt}公噸，當日用水量${waterUsed}公噸;15,000噸儲水槽水位${level}公尺，水位${levelTrend}${Math.abs(levelDiff)}公尺，實際儲水量${realStock}公噸，上午08:30蒸氣流量${amFlow}公噸/小時，下午13:30蒸氣流量${pmFlow}公噸/小時。`;
        logText += `\n上午機組鍋爐運轉${amCount}部(${amUnits}號機)，下午機組鍋爐運轉${pmCount}部(${pmUnits}號機)，`;
        logText += `\n${dateDisplay}上午海水進水壓力#1:${press1}、#2:${press2}bar。R.O純水系統保養維護，純水輸送至各供水槽使用。`;
        document.getElementById('logResult').value = logText;
    }

    function copyLog() { const t = document.getElementById('logResult'); t.select(); document.execCommand('copy'); alert("已複製！"); }
    function closeLogModal() { document.getElementById('logModal').style.display = 'none'; }
    function openLogModal() { document.getElementById('logModal').style.display = 'block'; }
    window.onclick = function(event) {
        if (event.target == document.getElementById('logModal')) closeLogModal();
        if (event.target == document.getElementById('reportModal')) closeReportModal();
    }

    function initDropdown() {
        const select = document.getElementById('chartParam');
        if (select.options.length > 0) return;
        const targetFields = ["回收水量", "1號機造水量", "2號機造水量", "15000公秉儲水位", "用水量", "尿素比重", "尿素用量", "尿素庫存", "1號機海水壓力", "2號機海水壓力"];
        for (let i = 2; i < rawData.headers.length; i++) {
            let header = rawData.headers[i].trim();
            if (targetFields.includes(header)) select.innerHTML += `<option value="${i}">${header}</option>`;
        }
        const defaultLevel = Array.from(select.options).find(option => option.textContent.trim() === "15000公秉儲水位");
        if (defaultLevel) select.value = defaultLevel.value;
        document.getElementById('timeRange').value = "2160";
    }

    function updateLineChart() {
        const colIdx = parseInt(document.getElementById('chartParam').value);
        const labelName = rawData.headers[colIdx];
        const unit = rawData.units[colIdx] || "";
        const limit = parseFloat(rawData.limits[colIdx]);
        const rangeHours = parseInt(document.getElementById('timeRange').value, 10);
        const now = new Date(); const startTime = new Date(now.getTime() - rangeHours * 60 * 60 * 1000);
        const labels = []; const values = [];
        const today = new Date(); today.setHours(23, 59, 59, 999);

        rawData.data.forEach(row => {
            let d = new Date(row[0]);
            if (d >= startTime && d <= today) {
                let timeLabel = (d.getMonth()+1) + "/" + d.getDate();
                labels.push(timeLabel); values.push(parseFloat(row[colIdx]) || null);
            }
        });

        const ctx = document.getElementById('lineChart').getContext('2d');
        if (lineChart) lineChart.destroy();
        const datasets = [{ label: labelName, data: values, borderColor: '#007bff', backgroundColor: 'rgba(0, 123, 255, 0.1)', borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, fill: true, tension: 0.1 }];
        if (!isNaN(limit)) datasets.push({ label: '上限', data: new Array(labels.length).fill(limit), borderColor: '#dc3545', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false });

        lineChart = new Chart(ctx, {
            type: 'line', data: { labels: labels, datasets: datasets },
            options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { y: { beginAtZero: true, title: {display: true, text: unit} } } }
        });
    }
</script>
</body>
</html>
