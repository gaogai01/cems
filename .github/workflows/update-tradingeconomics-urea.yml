name: Update Trading Economics urea price

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch latest daily quote
        run: python scripts/update_tradingeconomics_urea.py
      - name: Commit updated quote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tradingeconomics_urea.json data/tradingeconomics_urea_history.csv
          if git diff --cached --quiet; then
            echo "Quote unchanged; no commit needed."
          else
            git commit -m "Update Trading Economics urea price"
            git push
          fi
