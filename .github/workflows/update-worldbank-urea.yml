name: Update urea price and USD exchange rate

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_bot_exchange_rate.py'
      - '.github/workflows/update-worldbank-urea.yml'

permissions:
  contents: write

jobs:
  update-urea-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Fetch latest monthly price
        run: python scripts/update_worldbank_urea.py
      - name: Fetch latest Bank of Taiwan USD rate
        run: python scripts/update_bot_exchange_rate.py
      - name: Commit data when it changes
        run: |
          if git diff --quiet -- data/worldbank_urea.json data/bot_usd_twd.json; then
            echo "No urea price update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/worldbank_urea.json data/bot_usd_twd.json
          git commit -m "Update urea price and USD/TWD reference rate"
          git push
