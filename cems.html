<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEMS 監測 - 尖山發電廠</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <link rel="stylesheet" href="css/style-cems.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<div id="quickChartModal" class="quick-chart-modal" role="dialog" aria-modal="true" aria-labelledby="quickChartTitle" onclick="if(event.target === this) closeQuickChart()">
    <div class="quick-chart-dialog">
        <div class="quick-chart-header">
            <h2 id="quickChartTitle">監測數據｜近24小時</h2>
            <button type="button" class="quick-chart-close" aria-label="關閉曲線圖" onclick="closeQuickChart()">&times;</button>
        </div>
        <div id="quickChartStatus" class="quick-chart-status" role="status"></div>
        <div class="quick-chart-canvas"><canvas id="quickHistoryChart"></canvas></div>
    </div>
</div>
    
<div class="cems-container">
    <header>
        <div class="header-spacer"></div>
        <div class="header-title"><h1>CEMS</h1></div>
        <div class="header-controls">
            <button class="theme-toggle" onclick="toggleTheme()"><span id="themeIcon">☀️ 亮色</span></button>
            <div id="updateTime" class="update-pill">連線中...</div>
        </div>
    </header>

    <div class="dashboard">
        <div class="card power">
            <h3>目前總發電量</h3>
            <div class="data-row"><span class="value" id="totalLoad">0</span><span class="unit">KW</span></div>
            <div class="gauge-container"><div class="gauge-bar" id="bar-power"></div><div class="gauge-marker" id="marker-power"></div></div>
            <div class="sub-val" id="loadDiff">讀取中...</div>
        </div>
        <div class="card units">
            <h3>運轉機組數</h3>
            <div class="data-row"><span class="value" id="runningCountVal">0</span><span class="unit">台</span></div>
            <div class="gauge-container"><div class="gauge-bar" id="bar-units"></div><div class="gauge-marker" id="marker-units"></div></div>
            <div class="sub-val" id="boilerCountVal">含鍋爐: 0</div>
        </div>
        <div class="card urea">
            <h3>尿素推估日用量</h3>
            <div class="data-row"><span class="value" id="totalUreaVal">0.0</span><span class="unit">kL/日</span></div>
            <div class="gauge-container"><div class="gauge-bar" id="bar-urea"></div><div class="gauge-marker" id="marker-urea"></div></div>
            <div class="sub-val">依目前流量外推，非當日累計</div>
        </div>
        <div class="card aqi">
            <h3>澎湖 AQI</h3>
            <div class="data-row"><span class="value" id="aqiVal">--</span><span class="unit"></span></div>
            <div class="gauge-container"><div class="gauge-bar" id="bar-aqi"></div><div class="gauge-marker" id="marker-aqi"></div></div>
            <div class="sub-val" id="aqiStatus">載入中</div>
        </div>
        <div class="card temp">
            <h3>湖西鄉氣溫</h3>
            <div class="data-row"><span class="value" id="tempVal">--</span><span class="unit">°C</span></div>
            <div class="gauge-container"><div class="gauge-bar" id="bar-temp"></div><div class="gauge-marker" id="marker-temp"></div></div>
            <div class="sub-val">即時氣溫</div>
        </div>
        <div class="card wind">
            <h3>環境風速 / 風向</h3>
            <div class="data-row"><span class="value" id="windSpeed">--</span><span class="unit">m/s</span></div>
            <div class="gauge-container"><div class="gauge-bar" id="bar-wind"></div><div class="gauge-marker" id="marker-wind"></div></div>
            <div class="sub-val" id="windDir">--</div>
        </div>
    </div>

    <div id="loading">讀取機組數據中...</div>

    <div class="table-container">
        <table id="dataTable" style="display:none;">
            <thead>
                <tr>
                    <th>機組</th><th>SO2<br>(ppm)</th><th>NOx<br>(ppm)</th><th>OPAC<br>(%)</th><th>TEMP<br>(°C)</th><th>O2<br>(%)</th><th>Vel<br>(m/s)</th><th>Flow<br>(nm3/hr)</th><th>Load<br>(kw)</th><th>Urea<br>(L/hr)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<div class="chart-controls">
    <div class="control-group">
        <label class="fw-bold">機組：</label>
        <select id="chartMachine">
            <option value="1">#1</option><option value="2">#2</option><option value="3">#3</option>
            <option value="4">#4</option><option value="5">#5</option><option value="6">#6</option>
            <option value="7">#7</option><option value="8">#8</option><option value="9">#9</option>
            <option value="10">#10</option><option value="11">#11</option><option value="12">#12</option>
        </select>
    </div>

    <div class="control-group">
        <label class="fw-bold">監測項目（同單位可多選）：</label>
        <div class="checkbox-group">
            <label><input type="checkbox" class="pollutant-check" value="so2"> SO2</label>
            <label><input type="checkbox" class="pollutant-check" value="nox" checked> NOx</label>
            <label><input type="checkbox" class="pollutant-check" value="opac"> OPAC</label>
            <label><input type="checkbox" class="pollutant-check" value="temp"> Temp</label>
            <label><input type="checkbox" class="pollutant-check" value="urea"> Urea</label>
            <label><input type="checkbox" class="pollutant-check" value="load"> Load</label>
        </div>
        <small id="chartMetricHint" role="status" style="font-size:0.8rem; color:var(--text-sub);">可多選相同單位的項目</small>
    </div>

    <div class="control-group">
        <label class="fw-bold">範圍：</label>
        <select id="chartRange">
            <option value="24h">24H</option>
            <option value="7d">7天</option>
            <option value="30d">30天</option>
        </select>
    </div>

    <div class="control-group">
        <input type="date" id="chartDate">
        <button onclick="updateChartFromHistory()" class="btn-update">更新圖表</button>
    </div>
</div>

<style>
    .chart-controls {
        display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;
    }
    .control-group { display: flex; align-items: center; gap: 5px; }
    .checkbox-group { display: flex; gap: 10px; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 4px; }
    .checkbox-group label { cursor: pointer; display: flex; align-items: center; gap: 3px; font-size: 0.9rem; }
    .btn-update { padding: 5px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>
<div id="chartDataStatus" role="status" style="font-size:0.85rem; color:var(--text-sub); padding:4px 2px;"></div>

    <div class="chart-container">
        <canvas id="historyChart"></canvas>
    </div>
<div class="row mb-3"> <div class="col-12">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold"><i class="bi bi-bar-chart-fill"></i> 尿素每日用量統計 (近7日)</span>
                <div id="ureaStatus" class="small"></div>
            </div>
            
            <div class="card-body">
                <div style="position: relative; height: 350px; width: 100%;">
                    <canvas id="ureaChart"></canvas>
                </div>
                
                <hr>

                <div class="d-flex justify-content-between align-items-center mb-2 px-2 bg-light py-2 rounded border">
                    <button id="btnPrevDay" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-chevron-left"></i> 前一天
                    </button>
                    
                    <div class="d-flex align-items-center">
                        <label for="ureaDatePicker" class="me-2 fw-bold text-muted small">日期:</label>
                        <input type="date" id="ureaDatePicker" class="form-control form-control-sm text-center fw-bold" style="width: 140px;">
                    </div>

                    <button id="btnNextDay" class="btn btn-outline-secondary btn-sm">
                        後一天 <i class="bi bi-chevron-right"></i>
                    </button>
                </div>

                <div id="ureaTableContainer"></div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
    function startApp() {
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPLWcCJhnE_ZnnIbCgk9hNcjo6ikLDR_rzFGCiBFPamXapAj3e-fg1YiJo1THW08T4/exec';
        const LAT = 23.575; const LON = 119.665;
        let lastSuccessfulCemsUpdateText = null;
        const THRESHOLDS = {
            so2: { warn: 120, limit: 133, max: 200 }, nox: { warn: 327, limit: 363, max: 400 }, opac: { warn: 8, limit: 40, max: 50 }, load: { warn: 8000, limit: 9000, max: 11000 }, urea: { warn: 200, limit: 360, max: 400 },
            powerCard: { max: 120000 }, unitsCard: { max: 12 }, ureaCard: { max: 50 }, aqiCard: { max: 150 }, tempCard: { max: 40 }, windCard: { max: 25 }
        };
        const GAUGE_VALUES = { aqi: [0, 0, 50, 100, 150], units: [0, 3, 9, 11, 12], urea: [0, 10, 30, 45, 50], power: [0, 30000, 70000, 110000, 120000], temp: [7, 16, 23, 28, 37], wind: [0, 3, 4, 8, 25] };
        const COLORS_4 = ['#29b6f6', '#00e676', '#ffea00', '#ff1744'];
        let chartInstance = null; let globalHistoryData = []; let currentTotalLoadVal = 0; const BOILER_UNITS = [1, 2, 3, 4, 5, 7, 9, 11];

        function generateGradientByValue(values, colors, max) {
            let gradientStr = 'linear-gradient(90deg, ';
            for (let i = 0; i < values.length - 1; i++) {
                let startPct = (values[i] / max) * 100; let endPct = (values[i+1] / max) * 100;
                let color = colors[i] || colors[colors.length-1];
                gradientStr += `${color} ${startPct}%, ${color} ${endPct}%`;
                if (i < values.length - 2) gradientStr += ', ';
            }
            return gradientStr + ')';
        }
        function initGauges() {
            document.getElementById('bar-aqi').style.background = generateGradientByValue(GAUGE_VALUES.aqi, COLORS_4, THRESHOLDS.aqiCard.max);
            document.getElementById('bar-units').style.background = generateGradientByValue(GAUGE_VALUES.units, COLORS_4, THRESHOLDS.unitsCard.max);
            document.getElementById('bar-urea').style.background = generateGradientByValue(GAUGE_VALUES.urea, COLORS_4, THRESHOLDS.ureaCard.max);
            document.getElementById('bar-power').style.background = generateGradientByValue(GAUGE_VALUES.power, COLORS_4, THRESHOLDS.powerCard.max);
            document.getElementById('bar-temp').style.background = generateGradientByValue(GAUGE_VALUES.temp, COLORS_4, THRESHOLDS.tempCard.max);
            document.getElementById('bar-wind').style.background = generateGradientByValue(GAUGE_VALUES.wind, COLORS_4, THRESHOLDS.windCard.max);
        }
        window.toggleTheme = function() { 
            const body = document.body; body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            document.getElementById('themeIcon').innerText = isLight ? "🌙 暗色" : "☀️ 亮色";
            if (chartInstance) updateChartTheme(isLight);
        };
        function updateGauge(markerId, val, max) {
            let percentage = (val / max) * 100; if (percentage > 100) percentage = 100; if (percentage < 0) percentage = 0;
            document.getElementById(markerId).style.left = percentage + "%";
        }
        function getValueColor(val, type) {
            val = parseFloat(val); if (isNaN(val)) return ""; if (!THRESHOLDS[type]) return "";
            if (val > THRESHOLDS[type].limit) return "col-limit";
            if (val > THRESHOLDS[type].warn) return "col-warn";
            if (type === 'so2' && val < 50) return "col-good"; if (type === 'nox' && val < 247) return "col-good"; if (type === 'opac' && val < 4) return "col-good";
            return "";
        }

        // --- 核心格式化函式 (含校正與超標標籤) ---
        function formatCell(val, type, statusCode, codeVal, overCount) {
            let displayVal = parseFloat(val);
            
            // 1. 數值處理
            if (isNaN(displayVal)) {
                displayVal = "-";
            } else {
                if (statusCode === 'N') {
                    displayVal = Math.round(displayVal); // 運轉中取整數 (與舊邏輯一致)
                    // 只有非運轉才顯示小數? 舊代碼是這樣寫的:
                    // let showOpac = (parseFloat(opac)||0).toFixed(1)
                    // 我們這裡統一邏輯：如果是 opacity/o2/vel/temp 還是要保留小數
                    if (['opac', 'o2', 'vel', 'temp'].includes(type)) displayVal = parseFloat(val).toFixed(1);
                } else {
                    // 停機顯示小數
                    displayVal = type === 'opac' || type === 'temp' ? displayVal.toFixed(1) : displayVal.toFixed(2);
                }
            }

            // 2. 顏色判定
            let colorClass = "";
            if (statusCode === 'N') {
                colorClass = getValueColor(val, type);
            }

            // 3. 標籤生成
            let badges = "";
            if (codeVal == '20') {
                badges += `<span class="badge badge-calib">校正</span>`;
            }
            if (parseInt(overCount) >= 1) {
                badges += `<span class="badge badge-over">超標${overCount}次</span>`;
            }

            return `<span class="${colorClass}">${displayVal}</span>${badges}`;
        }

        async function fetchRealtimeData() {
            try {
                const response = await fetch(GAS_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (!json || !json.dataString) throw new Error("即時資料格式異常");
                renderTable(json.timestamp, json.dataString);
                calculateLoadComparison();
            } catch (error) {
                console.error(error);
                const lastUpdate = lastSuccessfulCemsUpdateText
                    ? `最後成功更新：${lastSuccessfulCemsUpdateText}；資料可能已過期`
                    : "尚無成功讀取的即時資料";
                document.getElementById('updateTime').innerText = `即時資料連線異常（${lastUpdate}）`;
            }
        }

        function renderTable(timestamp, rawString) {
            document.getElementById('loading').style.display = 'none'; document.getElementById('dataTable').style.display = 'table';
            lastSuccessfulCemsUpdateText = new Date(timestamp).toLocaleTimeString();
            document.getElementById('updateTime').innerText = "更新: " + lastSuccessfulCemsUpdateText;
            const dataArray = rawString.split(','); const tbody = document.getElementById('tableBody'); tbody.innerHTML = "";
            const ITEMS_PER_MACHINE = 27; let runCount = 0; let boilerRunCount = 0; let totalGenLoad = 0; let totalUreaKLD = 0;
            let totals = { so2: 0, nox: 0, opac: 0, temp: 0, o2: 0, vel: 0, flow: 0, load: 0, urea: 0 };
            
            for (let i = 0; i < 12; i++) {
                let machineId = i + 1; let baseIndex = i * ITEMS_PER_MACHINE; if (baseIndex + 26 >= dataArray.length) break;
                
                // 提取關鍵欄位
                let statusCode = dataArray[baseIndex + 2];
                const isRunning = statusCode === 'N';
                let rowClass = isRunning ? 'status-run' : 'status-stop';
                const statusLabel = isRunning ? '運轉' : '非運轉';

                // 數值
                let so2 = dataArray[baseIndex + 1];
                let nox = dataArray[baseIndex + 6];
                let opac = dataArray[baseIndex + 10];
                let temp = dataArray[baseIndex + 14];
                let o2 = dataArray[baseIndex + 18];
                let vel = dataArray[baseIndex + 21];
                let flow = dataArray[baseIndex + 22];
                let load = dataArray[baseIndex + 25];
                let urea = dataArray[baseIndex + 26];

                // 狀態碼與超標次數 (Index 偏移量)
                // SO2: Val(1), Stat(2), Code(3), Over(4)
                let so2_code = dataArray[baseIndex + 3];
                let so2_over = dataArray[baseIndex + 4];
                
                // NOx: Val(6), Stat(7), Code(8), Over(9)
                let nox_code = dataArray[baseIndex + 8];
                let nox_over = dataArray[baseIndex + 9];
                
                // Opac: Val(10), Stat(11), Code(12), Over(13)
                let opac_code = dataArray[baseIndex + 12];
                let opac_over = dataArray[baseIndex + 13];

                if (statusCode === 'N') {
                    runCount++; if (BOILER_UNITS.includes(machineId)) boilerRunCount++;
                    totals.so2 += parseFloat(so2)||0; totals.nox += parseFloat(nox)||0; totals.opac += parseFloat(opac)||0; totals.temp += parseFloat(temp)||0; totals.o2 += parseFloat(o2)||0; totals.vel += parseFloat(vel)||0; totals.flow += parseFloat(flow)||0; totals.load += parseFloat(load)||0; totals.urea += parseFloat(urea)||0;
                    totalGenLoad += parseFloat(load)||0; totalUreaKLD += (parseFloat(urea)||0) * 24 / 1000;
                }

                // 生成 HTML
                let cell_so2 = formatCell(so2, 'so2', statusCode, so2_code, so2_over);
                let cell_nox = formatCell(nox, 'nox', statusCode, nox_code, nox_over);
                let cell_opac = formatCell(opac, 'opac', statusCode, opac_code, opac_over);
                
                // 其他欄位保持原樣 (無 code/over)
                let cell_temp = formatCell(temp, 'temp', statusCode, 0, 0);
                let cell_o2 = formatCell(o2, 'o2', statusCode, 0, 0);
                let cell_vel = formatCell(vel, 'vel', statusCode, 0, 0);
                
                let cell_load = "";
                if(statusCode==='N') cell_load = `<span class="${getValueColor(load,'load')}">${Math.round(load)}</span>`;
                else cell_load = `<span>${Math.round(load)}</span>`;
                
                let cell_urea = "";
                if(statusCode==='N') cell_urea = `<span class="${getValueColor(urea,'urea')}">${Math.round(urea)}</span>`;
                else cell_urea = `<span>${Math.round(urea)}</span>`;

                tbody.innerHTML += `<tr class="${rowClass}">
                    <td class="machine-cell"><span class="machine-number">#${machineId}</span><small class="machine-status ${isRunning ? 'machine-running' : 'machine-stopped'}">${statusLabel}</small></td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'so2')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'so2')">${cell_so2}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'nox')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'nox')">${cell_nox}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'opac')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'opac')">${cell_opac}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'temp')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'temp')">${cell_temp}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'o2')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'o2')">${cell_o2}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'vel')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'vel')">${cell_vel}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'flow')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'flow')">${Math.round(flow)}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'load')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'load')">${cell_load}</td>
                    <td class="metric-cell" title="點選查看近24小時曲線" onclick="openQuickChart(${machineId}, 'urea')" role="button" tabindex="0" onkeydown="handleQuickChartKeydown(event, ${machineId}, 'urea')">${cell_urea}</td>
                </tr>`;
            }

            currentTotalLoadVal = totalGenLoad;
            document.getElementById('totalLoad').innerText = totalGenLoad.toLocaleString(); updateGauge('marker-power', totalGenLoad, THRESHOLDS.powerCard.max);
            document.getElementById('runningCountVal').innerText = runCount; document.getElementById('boilerCountVal').innerText = `含鍋爐: ${boilerRunCount}`; updateGauge('marker-units', runCount, THRESHOLDS.unitsCard.max);
            document.getElementById('totalUreaVal').innerText = totalUreaKLD.toFixed(1); updateGauge('marker-urea', totalUreaKLD, THRESHOLDS.ureaCard.max);
            
            if (runCount > 0) {
                let avgNox = totals.nox / runCount; let avgNoxClass = avgNox > 247 ? "col-warn" : "";
                tbody.innerHTML += `<tr class="avg-row"><td>平均</td><td>${Math.round(totals.so2 / runCount)}</td><td class="${avgNoxClass}">${Math.round(avgNox)}</td><td>${(totals.opac / runCount).toFixed(1)}</td><td>${Math.round(totals.temp / runCount)}</td><td>${(totals.o2 / runCount).toFixed(1)}</td><td>${(totals.vel / runCount).toFixed(1)}</td><td>${Math.round(totals.flow / runCount)}</td><td>${Math.round(totals.load / runCount)}</td><td>${Math.round(totals.urea / runCount)}</td></tr>`;
            } else { tbody.innerHTML += `<tr class="avg-row"><td colspan="10">無運轉機組</td></tr>`; }
        }
        
        async function fetchHistoryData() {
            const status = document.getElementById('chartDataStatus');
            try {
                const response = await fetch(GAS_URL + "?type=history");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (!Array.isArray(json)) throw new Error("歷史資料格式異常");
                globalHistoryData = json;
                if (status) status.innerText = `歷史資料已載入 ${json.length} 筆`;
                updateChartFromHistory();
                calculateLoadComparison();
            } catch (error) {
                console.error("歷史資料錯誤", error);
                if (status) status.innerText = "歷史資料連線異常，圖表可能未更新";
            }
        }
        function calculateLoadComparison() {
            if (globalHistoryData.length === 0 || currentTotalLoadVal === 0) return;
            const now = new Date(); const targetTime = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            let closestRecord = null; let minDiff = Infinity;
            for (let row of globalHistoryData) { let rowTime = new Date(row.t); let diff = Math.abs(rowTime - targetTime); if (diff < 1800000 && diff < minDiff) { minDiff = diff; closestRecord = row; } }
            const diffEl = document.getElementById('loadDiff');
            if (closestRecord) {
                let oldLoad = 0; const dataParts = closestRecord.d.split(','); const ITEMS_PER_MACHINE = 27;
                for (let i = 0; i < 12; i++) { let base = i * ITEMS_PER_MACHINE; if (base + 26 < dataParts.length) { let status = dataParts[base + 2]; let load = parseFloat(dataParts[base + 25]) || 0; if (status === 'N') oldLoad += load; } }
                let diffPercent = 0; let diffClass = "diff-flat"; let icon = "-";
                if (oldLoad > 0) { diffPercent = ((currentTotalLoadVal - oldLoad) / oldLoad) * 100; if (diffPercent > 0) { diffClass = "diff-up"; icon = "▲"; } else if (diffPercent < 0) { diffClass = "diff-down"; icon = "▼"; } }
                diffEl.innerHTML = `<span style="color:var(--text-sub)">昨日: ${oldLoad.toLocaleString()}</span> <span class="${diffClass}">${icon} ${Math.abs(diffPercent).toFixed(1)}%</span>`;
            } else { diffEl.innerText = "無昨日數據"; }
        }
// === 1. 定義汙染物參數 (包含顏色、偏移量、Y軸設定) ===
        const POLLUTANT_CONFIG = {
            so2:  { offset: 1,  label: 'SO2 (ppm)',  color: '#29b6f6', unit: 'ppm' },
            nox:  { offset: 6,  label: 'NOx (ppm)',  color: '#ffea00', unit: 'ppm' },
            opac: { offset: 10, label: 'OPAC (%)',   color: '#bdbdbd', unit: '%' },
            temp: { offset: 14, label: 'Temp (°C)',  color: '#ff9800', unit: '°C' },
            load: { offset: 25, label: 'Load (KW)',  color: '#00e676', yAxisID: 'y1', unit: 'kW' },
            urea: { offset: 26, label: 'Urea (L/hr)',color: '#ff1744', unit: 'L/hr' }
        };

        const chartMetricHint = document.getElementById('chartMetricHint');
        document.querySelectorAll('.pollutant-check').forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                const selected = Array.from(document.querySelectorAll('.pollutant-check:checked'));
                const units = new Set(selected.map(item => POLLUTANT_CONFIG[item.value].unit));
                if (units.size > 1) {
                    checkbox.checked = false;
                    if (chartMetricHint) chartMetricHint.innerText = '不同單位不能混畫；請先取消目前選取項目。';
                    return;
                }
                if (chartMetricHint) {
                    chartMetricHint.innerText = selected.length
                        ? `目前圖表單位：${POLLUTANT_CONFIG[selected[0].value].unit}`
                        : '可多選相同單位的項目';
                }
            });
        });

        // === 2. 更新圖表數據 (多選邏輯) ===
        window.updateChartFromHistory = function() {
            if (globalHistoryData.length === 0) return;

            const machineId = parseInt(document.getElementById('chartMachine').value);
            const range = document.getElementById('chartRange').value;
            const dateInput = document.getElementById('chartDate').value;

            // 1. 找出所有被勾選的項目
            const checkedBoxes = document.querySelectorAll('.pollutant-check:checked');
            if (checkedBoxes.length === 0) {
                alert("請至少選擇一個監測項目");
                return;
            }
            const selectedUnits = new Set(Array.from(checkedBoxes).map(box => POLLUTANT_CONFIG[box.value].unit));
            if (selectedUnits.size > 1) {
                if (chartMetricHint) chartMetricHint.innerText = '不同單位不能混畫；請重新選擇。';
                return;
            }
            const chartUnit = POLLUTANT_CONFIG[checkedBoxes[0].value].unit;

            // 2. 設定時間範圍
            let endTime = dateInput ? new Date(dateInput) : new Date();
            if (dateInput) endTime.setHours(23, 59, 59, 999);
            const startTime = new Date(endTime);
            if (range === '24h') startTime.setTime(endTime.getTime() - 24 * 60 * 60 * 1000);
            if (range === '7d') startTime.setDate(endTime.getDate() - 7);
            if (range === '30d') startTime.setDate(endTime.getDate() - 30);

            const ITEMS_PER_MACHINE = 27;
            const baseIndex = (machineId - 1) * ITEMS_PER_MACHINE;
            
            // 3. 準備多個 Datasets
            const datasets = [];
            let useRightAxis = false; // 標記是否需要啟用右軸

            checkedBoxes.forEach(checkbox => {
                const key = checkbox.value;
                const config = POLLUTANT_CONFIG[key];
                const dataPoints = [];

                globalHistoryData.forEach(row => {
                    const time = new Date(row.t);
                    if (time >= startTime && time <= endTime) {
                        const parts = row.d.split(',');
                        const val = parts[baseIndex + config.offset];
                        if (val !== undefined) {
                            const numericValue = Number(val);
                            dataPoints.push({
                                x: time,
                                y: String(val).trim() !== '' && Number.isFinite(numericValue) && numericValue >= 0 ? numericValue : null
                            });
                        }
                    }
                });

                if (dataPoints.length > 0) {
                    datasets.push({
                        label: config.label,
                        data: dataPoints,
                        borderColor: config.color,
                        backgroundColor: config.color, // Tooltip 顏色
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        tension: 0.3,
                        yAxisID: config.yAxisID || 'y' // 預設用左軸 'y'，Load 用右軸 'y1'
                    });
                    if (config.yAxisID === 'y1') useRightAxis = true;
                }
            });

            drawChart(datasets, useRightAxis, chartUnit);
        };

        // === 3. 繪製圖表 (支援負載右 Y 軸) ===
        function drawChart(datasets, useRightAxis, chartUnit) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const isLight = document.body.classList.contains('light-mode');
            const gridColor = isLight ? '#dddddd' : 'rgba(255,255,255,0.1)';
            const textColor = isLight ? '#666666' : '#aaaaaa';

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'hour', tooltipFormat: 'yyyy-MM-dd HH:mm' },
                            grid: { color: gridColor },
                            ticks: { color: textColor }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            grid: { color: gridColor },
                            ticks: { color: textColor },
                            title: { display: true, text: `數值（${chartUnit}）`, color: textColor }
                        },
                        y1: {
                            type: 'linear',
                            display: useRightAxis, // 只有當選了 Load 時才顯示右軸
                            position: 'right',
                            beginAtZero: true,
                            grid: { drawOnChartArea: false }, // 右軸不畫網格線，避免混亂
                            ticks: { color: '#00e676' }, // 綠色字體對應 Load
                            title: { display: useRightAxis, text: '負載 (KW)', color: '#00e676' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: textColor } },
                        tooltip: {
                            backgroundColor: isLight ? '#fff' : '#333',
                            titleColor: isLight ? '#000' : '#fff',
                            bodyColor: isLight ? '#000' : '#fff',
                            borderColor: '#ccc',
                            borderWidth: 1
                        }
                    }
                }
            });
        }
        function updateChartTheme(isLight) {
            const gridColor = isLight ? '#dddddd' : 'rgba(255,255,255,0.1)'; const textColor = isLight ? '#666666' : '#aaaaaa';
            chartInstance.options.scales.x.grid.color = gridColor; chartInstance.options.scales.x.ticks.color = textColor;
            chartInstance.options.scales.y.grid.color = gridColor; chartInstance.options.scales.y.ticks.color = textColor;
            chartInstance.options.plugins.legend.labels.color = textColor;
            chartInstance.options.plugins.tooltip.backgroundColor = isLight ? '#fff' : '#333';
            chartInstance.options.plugins.tooltip.titleColor = isLight ? '#000' : '#fff';
            chartInstance.options.plugins.tooltip.bodyColor = isLight ? '#000' : '#fff';
            chartInstance.update();
        }
        async function fetchWeather() {
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`;
                const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi`;
                const [weatherRes, aqiRes] = await Promise.all([fetch(weatherUrl), fetch(aqiUrl)]);
                if (!weatherRes.ok || !aqiRes.ok) throw new Error("環境資料 API 回應異常");
                const weatherData = await weatherRes.json(); const aqiData = await aqiRes.json();
                document.getElementById('tempVal').innerText = weatherData.current.temperature_2m; updateGauge('marker-temp', weatherData.current.temperature_2m, THRESHOLDS.tempCard.max);
                document.getElementById('windSpeed').innerText = weatherData.current.wind_speed_10m; updateGauge('marker-wind', weatherData.current.wind_speed_10m, THRESHOLDS.windCard.max);
                const windDeg = weatherData.current.wind_direction_10m;
                const directions = ['北風', '東北', '東風', '東南', '南風', '西南', '西風', '西北'];
                document.getElementById('windDir').innerText = directions[Math.round(windDeg / 45) % 8];
                const aqi = aqiData.current.us_aqi; document.getElementById('aqiVal').innerText = aqi; updateGauge('marker-aqi', aqi, THRESHOLDS.aqiCard.max);
                let aqiText = "良好", aqiColor = "#29b6f6";
                if(aqi > 50) { aqiText = "普通"; aqiColor = "#00e676"; } if(aqi > 100) { aqiText = "對敏感族群不健康"; aqiColor = "#ffeb3b"; } if(aqi > 150) { aqiText = "不健康"; aqiColor = "#ff1744"; }
                const aqiEl = document.getElementById('aqiStatus'); aqiEl.innerText = aqiText; aqiEl.style.color = aqiColor;
            } catch (error) {
                console.error("天氣讀取失敗:", error);
                document.getElementById('aqiVal').innerText = "--";
                document.getElementById('aqiStatus').innerText = "環境資料連線異常";
                document.getElementById('tempVal').innerText = "--";
                document.getElementById('windSpeed').innerText = "--";
                document.getElementById('windDir').innerText = "環境資料連線異常";
            }
        }

        initGauges(); fetchRealtimeData(); fetchHistoryData(); fetchWeather();
        setInterval(fetchRealtimeData, 10000); setInterval(fetchHistoryData, 300000); setInterval(fetchWeather, 300000);
    }
</script>
