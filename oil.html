<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261117">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑油化驗報告</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="css/style-oil.css">

</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container">
    <h2>
        化驗結果總覽
        <button class="btn-theme" onclick="toggleTheme()" style="float:right">🌓 切換模式</button>
    </h2>
    
    <div class="table-controls">
        <label>📅 篩選日期：</label>
        <select id="tableYear" onchange="renderOverviewTables()">
            <option value="latest">最新數據</option>
        </select>
        <select id="tableMonth" onchange="renderOverviewTables()">
            <option value="all">全部月份</option>
            <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
            <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
            <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
        </select>
    </div>

    <div id="loading">資料載入中...</div>
    <p id="dataFreshness" class="data-freshness" role="status" aria-live="polite"></p>
    
    <h3 class="section-title">發電機組 (#1 ~ #12)</h3>
    <div class="table-container">
        <table class="overview-table" id="dgTable"></table>
    </div>

    <h3 class="section-title">緊急發電機 (EG)</h3>
    <div class="table-container">
        <table class="overview-table" id="egTable"></table>
    </div>

    <div class="chart-section">
        <h2 style="border-left:5px solid #607d8b; padding-left:10px;">歷史趨勢分析 (多機組比較)</h2>
        <div class="chart-controls">
            <div class="control-group" style="flex:2;">
                <label>機組選擇 (可複選)：</label>
                <div id="machineCheckboxes" class="checkbox-container"></div>
            </div>
            <div class="control-group">
                <label>測項：</label>
                <select id="chartParam" onchange="updateChart()"></select>
            </div>
            <div class="control-group">
                <label>年度：</label>
                <select id="chartYear" onchange="updateChart()">
                    <option value="all">全部年份</option>
                </select>
            </div>
        </div>
        <div style="height: 450px;">
            <canvas id="historyChart"></canvas>
        </div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin:0;">機組詳情</h3>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body" id="modalBody">
            </div>
    </div>
</div>

<script src="common.js"></script>

<script>
    // API 設定
    const API_URL = "https://script.google.com/macros/s/AKfycbwqP_rRkI8xyVYFvo8nWY9pq4i1OLlvrLfAMxmleSAh-XDbMQN3yGk3eF0j5OdDDVMYxw/exec";

    let rawData = { headers: [], cnHeaders: [], units: [], dgLimits: { upper: [], lower: [] }, egLimits: { upper: [], lower: [] }, data: [] };
    let chartInstance = null;
    let controlsInitialized = false;
    let machineGroupsCache = null;
    let chartObserver = null;
    const OIL_CACHE_KEY = 'oilReportCacheV1';
    const LINE_COLORS = ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#808080'];

    function startApp() {
        if(localStorage.getItem('oil_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
        loadCachedOilData();
        fetchData();
    }

    function normalizeOilResponse(json) {
        if (!json || !Array.isArray(json.data)) throw new Error("報表資料格式錯誤");
        if (json.dgLimits && json.egLimits) return json;
        return {
            headers: json.headers || [],
            cnHeaders: json.cnHeaders || [],
            units: json.units || [],
            data: json.data || [],
            dgLimits: { upper: json.upperLimits || [], lower: json.lowerLimits || [] },
            egLimits: { upper: json.upperLimits || [], lower: json.lowerLimits || [] }
        };
    }

    function applyOilData(json, fromCache = false) {
        rawData = normalizeOilResponse(json);
        machineGroupsCache = null;
        updateFreshnessNotice(fromCache);
        document.getElementById('loading').style.display = 'none';

        if (!controlsInitialized) {
            initControls();
            controlsInitialized = true;
            initializeChartOnDemand();
        } else if (chartInstance) {
            updateChart();
        }
        renderOverviewTables();
    }

    function loadCachedOilData() {
        try {
            const cached = JSON.parse(localStorage.getItem(OIL_CACHE_KEY) || "null");
            if (!cached || !cached.data) return;
            applyOilData(cached.data, true);
        } catch (error) {
            console.warn("讀取滑油報告快取失敗", error);
        }
    }

    async function fetchData() {
        try {
            const res = await fetch(API_URL + "?mode=oil");
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const normalized = normalizeOilResponse(json);
            applyOilData(normalized, false);

            try {
                localStorage.setItem(OIL_CACHE_KEY, JSON.stringify({
                    savedAt: Date.now(),
                    data: normalized
                }));
            } catch (cacheError) {
                console.warn("儲存滑油報告快取失敗", cacheError);
            }
        } catch (e) {
            console.error("Error:", e);
            if (rawData.data.length > 0) {
                const notice = document.getElementById('dataFreshness');
                if (notice) notice.textContent += '｜即時更新失敗，顯示上次快取資料';
                document.getElementById('loading').style.display = 'none';
            } else {
                document.getElementById('loading').innerText = "載入失敗";
            }
        }
    }

    const STALE_DATA_DAYS = 90;

    function parseReportDate(value) {
        const match = String(value ?? '').trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (!match) return null;
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const date = new Date(year, month - 1, day);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
        return date;
    }

    function normalizeDateKey(value) {
        const date = parseReportDate(value);
        if (!date) return null;
        return [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, '0'),
            String(date.getDate()).padStart(2, '0')
        ].join('-');
    }

    function updateFreshnessNotice(fromCache = false) {
        const notice = document.getElementById('dataFreshness');
        if (!notice) return;
        const latest = { dg: null, eg: null };
        rawData.data.forEach(row => {
            const date = parseReportDate(row[0]);
            if (!date) return;
            const group = String(row[1] || '').toUpperCase().includes('EG') ? 'eg' : 'dg';
            if (!latest[group] || date > latest[group]) latest[group] = date;
        });

        const label = date => date
            ? date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate()
            : '無資料';
        const dates = [latest.dg, latest.eg].filter(Boolean);
        notice.className = 'data-freshness';
        if (!dates.length) {
            notice.textContent = '目前沒有可辨識的化驗日期。';
            return;
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        notice.textContent = '最新檢驗日：柴油機 ' + label(latest.dg) + '；緊急發電機 ' + label(latest.eg) + '。' +
            (fromCache ? '｜快取資料，正在背景更新' : '');
        const staleGroups = [
            { name: '柴油機', date: latest.dg },
            { name: '緊急發電機', date: latest.eg }
        ].filter(group => {
            if (!group.date) return false;
            const date = new Date(group.date.getFullYear(), group.date.getMonth(), group.date.getDate());
            group.ageDays = Math.floor((today - date) / 86400000);
            return group.ageDays > STALE_DATA_DAYS;
        });
        if (staleGroups.length) {
            notice.classList.add('stale-warning');
            notice.textContent += ' 注意：' + staleGroups.map(group => group.name + '資料已距今 ' + group.ageDays + ' 天').join('；') +
                '，超過 ' + STALE_DATA_DAYS + ' 天，請確認是否有新化驗報告。';
        }
    }

    function toggleTheme() {
        const body = document.body;
        const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        body.setAttribute('data-theme', next);
        localStorage.setItem('oil_theme', next);
        if(chartInstance) updateChart();
    }

    // 狀態檢查
    function checkStatus(val, colIdx, isEG) {
        if (val === "" || val === undefined) return true; 
        let num = parseFloat(val);
        if (isNaN(num)) return true; 
        
        const limits = isEG ? rawData.egLimits : rawData.dgLimits;
        if (!limits || !limits.lower || !limits.upper) return true;

        const lower = limits.lower[colIdx];
        const upper = limits.upper[colIdx];

        if (lower !== "" && num < parseFloat(lower)) return false;
        if (upper !== "" && num > parseFloat(upper)) return false;
        return true;
    }

    // 緊急發電機資料欄位與柴油機不同：第 17 欄為閃火點，第 18 欄未使用。
    function getOilColumnMeta(index, isEG) {
        if (isEG && index === 17) return { name: '閃火點', unit: '℃' };
        if (isEG && index === 18) return null;
        return {
            name: rawData.cnHeaders[index] || rawData.headers[index] || '',
            unit: rawData.units[index] || ''
        };
    }

    function getOilColumnIndices(isEG) {
        const columns = [];
        for (let index = 2; index < rawData.headers.length - 1; index++) {
            if (getOilColumnMeta(index, isEG)) columns.push(index);
        }
        return columns;
    }

    function getSelectedMachineTypes() {
        const selected = Array.from(document.querySelectorAll('#machineCheckboxes input:checked')).map(input => input.value);
        return {
            selected,
            hasDG: selected.some(machine => !String(machine).toUpperCase().includes('EG')),
            hasEG: selected.some(machine => String(machine).toUpperCase().includes('EG'))
        };
    }

    function refreshChartParams() {
        const select = document.getElementById('chartParam');
        if (!select) return;
        const { hasDG, hasEG } = getSelectedMachineTypes();
        const isMixed = hasDG && hasEG;
        const isEGOnly = hasEG && !hasDG;
        const keepIndex = Number.parseInt(select.value, 10);
        select.innerHTML = '';

        for (let index = 2; index < rawData.headers.length - 1; index++) {
            // 混選柴油機與緊急機時，排除同一欄位代表不同測項的氧化讀數／閃火點與空白欄。
            if (isMixed && (index === 17 || index === 18)) continue;
            const meta = getOilColumnMeta(index, isEGOnly);
            if (!meta || !meta.name) continue;
            const suffix = isMixed ? '（柴油機／緊急發電機共通）' : '';
            const option = document.createElement('option');
            option.value = String(index);
            option.textContent = meta.name + suffix;
            select.appendChild(option);
        }

        if (Array.from(select.options).some(option => option.value === String(keepIndex))) {
            select.value = String(keepIndex);
        }
    }

    function handleChartMachineChange() {
        refreshChartParams();
        updateChart();
    }

    function getLimitText(colIdx, isEG) {
        const limits = isEG ? rawData.egLimits : rawData.dgLimits;
        if (!limits || !limits.lower || !limits.upper) return "-";
        const lower = limits.lower[colIdx];
        const upper = limits.upper[colIdx];
        if(lower !== "" && upper !== "") return `${lower}~${upper}`;
        if(lower !== "") return `>${lower}`;
        if(upper !== "") return `<${upper}`;
        return "-";
    }

    function getAllMachines() {
        let machines = [];
        if (rawData.data) machines = rawData.data.map(r => r[1]);
        // 這裡沒有 filter，所以所有機組 (#1~#12, EG) 都會顯示
        return [...new Set(machines)].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
    }

    function initControls() {
        const machines = getAllMachines();
        const years = new Set();
        rawData.data.forEach(r => { 
            if(r[0]) { const y = r[0].substring(0, 4); if(y) years.add(y); }
        });
        const sortedYears = [...years].sort().reverse();

        const tYearSelect = document.getElementById('tableYear');
        const cYearSelect = document.getElementById('chartYear');
        sortedYears.forEach(y => {
            tYearSelect.innerHTML += `<option value="${y}">${y}年</option>`;
            cYearSelect.innerHTML += `<option value="${y}">${y}年</option>`;
        });

        const mBox = document.getElementById('machineCheckboxes');
        mBox.innerHTML = "";
        machines.forEach((m, idx) => {
            const checked = (idx === 0) ? 'checked' : '';
            mBox.innerHTML += '<label class="checkbox-item"><input type="checkbox" value="' + m + '" ' + checked + ' onchange="handleChartMachineChange()"> ' + m + '</label>';
        });
        refreshChartParams();
    }

    // 渲染總覽表格 (已移除「判定」欄位)
    function renderOverviewTables() {
        document.getElementById('dgTable').innerHTML = "";
        document.getElementById('egTable').innerHTML = "";
        const selectedYear = document.getElementById('tableYear').value;
        const selectedMonth = document.getElementById('tableMonth').value;

        if (!machineGroupsCache) {
            machineGroupsCache = {};
            rawData.data.forEach(row => {
                const mId = row[1];
                if (!machineGroupsCache[mId]) machineGroupsCache[mId] = [];
                machineGroupsCache[mId].push(row);
            });
            Object.values(machineGroupsCache).forEach(history =>
                history.sort((a, b) => parseReportDate(b[0]) - parseReportDate(a[0]))
            );
        }
        const machineGroups = machineGroupsCache;
        const allKeys = Object.keys(machineGroups);
        const dgKeys = allKeys.filter(k => !k.toUpperCase().includes('EG')).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
        const egKeys = allKeys.filter(k => k.toUpperCase().includes('EG')).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));

        generateTable('dgTable', dgKeys, machineGroups, selectedYear, selectedMonth, false);
        generateTable('egTable', egKeys, machineGroups, selectedYear, selectedMonth, true);
    }

    function generateTable(tableId, keys, machineGroups, selectedYear, selectedMonth, isEG) {
        const table = document.getElementById(tableId);
        if(keys.length === 0) { table.innerHTML = "<tbody><tr><td>無資料</td></tr></tbody>"; return; }

        let thead = document.createElement('thead');
        let trHead = document.createElement('tr');
        trHead.innerHTML = `<th>機組</th><th>檢驗日期</th>`;
        const visibleColumns = getOilColumnIndices(isEG);
        visibleColumns.forEach(i => {
            const meta = getOilColumnMeta(i, isEG);
            const unit = meta.unit ? '<span class="unit-small">(' + meta.unit + ')</span>' : '';
            const th = document.createElement('th');
            th.innerHTML = meta.name + ' ' + unit;
            trHead.appendChild(th);
        });
        // ▼ 移除判定欄位表頭
        // const thDiag = document.createElement('th'); thDiag.innerText = "判定"; trHead.appendChild(thDiag);
        
        thead.appendChild(trHead);
        table.appendChild(thead);

        let tbody = document.createElement('tbody');
        keys.forEach(key => {
            const history = machineGroups[key];
            let targetRow = null;
            if (selectedYear === 'latest') {
                targetRow = history[0];
            } else {
                targetRow = history.find(row => {
                    const d = new Date(row[0]);
                    const y = d.getFullYear().toString();
                    const m = (d.getMonth() + 1).toString();
                    if (selectedMonth === 'all') return y === selectedYear;
                    return y === selectedYear && m === selectedMonth;
                });
            }

            if (!targetRow) {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${key}</td><td style="color:#ccc">無數據</td>`;
                visibleColumns.forEach(() => { tr.innerHTML += '<td>-</td>'; });
                tbody.appendChild(tr);
                return;
            }

            const dateStr = targetRow[0].split('T')[0];
            const diagIdx = rawData.headers.length - 1;
            const diagText = targetRow[diagIdx]; // 建議事項內容
            
            let tr = document.createElement('tr');
            tr.onclick = () => openModal(key, history.slice(0, 3), isEG);

            // 計算狀態 (用於顯示機組旁的紅綠燈)
            let hasError = false;
            for (let i = 2; i < rawData.headers.length - 1; i++) {
                if (!checkStatus(targetRow[i], i, isEG)) { hasError = true; break; }
            }
            const dotClass = hasError ? "dot-err" : "dot-ok";

            let tdName = document.createElement('td');
            // 保留紅綠燈，但移除判定欄位
            tdName.innerHTML = `<span class="status-dot ${dotClass}"></span>${key}`;
            // 如果有建議事項，顯示小圖示
            if (diagText && diagText.trim() !== "") {
                tdName.innerHTML += `<span class="diagnosis-text" title="有建議事項"> 📝</span>`;
            }
            tr.appendChild(tdName);

            let tdDate = document.createElement('td');
            tdDate.innerText = dateStr;
            tr.appendChild(tdDate);

            visibleColumns.forEach(i => {
                let td = document.createElement('td');
                let val = targetRow[i];
                if (!checkStatus(val, i, isEG)) {
                    td.className = "val-limit";
                    td.title = '標準: ' + getLimitText(i, isEG);
                }
                td.innerText = val;
                tr.appendChild(td);
            });
            // ▼ 移除判定結果的 td
            // let tdDiag = document.createElement('td'); ... tr.appendChild(tdDiag);

            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
    }

    // --- Modal (詳細視窗：建議顯示在最上方) ---
    function openModal(machineId, historyRows, isEG) {
        const modal = document.getElementById('detailModal');
        const modalBody = document.getElementById('modalBody'); // 取得 body 容器
        document.getElementById('modalTitle').innerText = `${machineId} - 詳細歷史紀錄`;
        
        // 1. 處理建議事項 (放在最上方)
        const diagIdx = rawData.headers.length - 1;
        const latestDiag = historyRows[0][diagIdx];
        let adviceHtml = "";
        
        // 檢查是否有異常 (決定建議框顏色)
        let hasError = false;
        for (let i = 2; i < rawData.headers.length - 1; i++) {
            if (!checkStatus(historyRows[0][i], i, isEG)) { hasError = true; break; }
        }
        const alertClass = hasError ? "alert-danger" : "alert-info"; // 紅色或藍色框
        const diagText = (latestDiag && latestDiag.trim() !== "") ? latestDiag : "本次化驗無特別建議事項。";

        adviceHtml = `
            <div class="advice-box ${alertClass}" style="padding:15px; margin-bottom:15px; border-radius:8px; border-left:5px solid; background-color:${hasError?'#ffebee':'#e3f2fd'}; border-left-color:${hasError?'#f44336':'#2196f3'}; color:${hasError?'#b71c1c':'#0d47a1'};">
                <strong>📝 最新建議 (${historyRows[0][0].split('T')[0]})：</strong><br>
                ${diagText}
            </div>
        `;

        // 2. 建立詳細表格
        let tableHtml = `<table class="detail-table" style="width:100%; border-collapse:collapse;"><thead><tr><th style="text-align:left; background:var(--table-head-bg);">檢驗項目</th><th style="background:var(--table-head-bg);">標準</th>`;
        
        historyRows.forEach((row, idx) => {
            const date = row[0].split('T')[0];
            tableHtml += `<th class="${idx===0?'col-latest':''}" style="background:var(--table-head-bg);">${date}</th>`;
        });
        for(let i=historyRows.length; i<3; i++) tableHtml += `<th style="background:var(--table-head-bg);">-</th>`;
        tableHtml += `</tr></thead><tbody>`;

        getOilColumnIndices(isEG).forEach(i => {
            const meta = getOilColumnMeta(i, isEG);
            const unitHtml = meta.unit ? ' <span style="color:#888;font-size:0.8em">(' + meta.unit + ')</span>' : '';
            const limitText = getLimitText(i, isEG);

            tableHtml += '<tr><td style="text-align:left; font-weight:bold;">' + meta.name + unitHtml + '</td><td style="color:#666;font-size:0.85em">' + limitText + '</td>';
            for(let j=0; j<3; j++) {
                const isLatest = (j === 0) ? 'col-latest' : '';
                if (j < historyRows.length) {
                    const val = historyRows[j][i];
                    const valClass = checkStatus(val, i, isEG) ? "" : "val-limit";
                    tableHtml += '<td class="' + isLatest + ' ' + valClass + '" style="border-bottom:1px solid var(--border-color); padding:8px;">' + val + '</td>';
                } else {
                    tableHtml += '<td class="' + isLatest + '" style="border-bottom:1px solid var(--border-color);"> - </td>';
                }
            }
            tableHtml += '</tr>';
        });
        tableHtml += `</tbody></table>`;

        // 組合內容
        modalBody.innerHTML = adviceHtml + tableHtml;
        modal.style.display = 'block';
    }
    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    window.onclick = function(event) { if (event.target == document.getElementById('detailModal')) closeModal(); }

    // 圖表移到接近畫面時才繪製，讓報告表格先出現
    function initializeChartOnDemand() {
        const section = document.querySelector('.chart-section');
        if (!section) return;
        if ('IntersectionObserver' in window) {
            chartObserver = new IntersectionObserver(entries => {
                if (entries.some(entry => entry.isIntersecting)) {
                    chartObserver.disconnect();
                    chartObserver = null;
                    updateChart();
                }
            }, { rootMargin: '200px 0px' });
            chartObserver.observe(section);
        } else {
            setTimeout(updateChart, 0);
        }
    }

    // --- 圖表更新 ---
    function updateChart() {
        const checkboxes = document.querySelectorAll('#machineCheckboxes input:checked');
        const selectedMachines = Array.from(checkboxes).map(cb => cb.value);
        const year = document.getElementById('chartYear').value;
        const pIdx = Number.parseInt(document.getElementById('chartParam').value, 10);

        if (selectedMachines.length === 0 || pIdx < 0) {
            if (chartInstance) {
                chartInstance.data.datasets = [];
                chartInstance.update('none');
            }
            return;
        }

        const selectedSet = new Set(selectedMachines);
        const valuesByMachine = new Map(selectedMachines.map(machine => [machine, new Map()]));
        const allLabels = new Set();

        // 一次掃描資料，避免每個機組重新 filter/sort；同日資料保留第一筆
        rawData.data.forEach(row => {
            const machine = row[1];
            if (!selectedSet.has(machine) || !row[0] || (year !== 'all' && !String(row[0]).startsWith(year))) return;
            const dateKey = normalizeDateKey(row[0]);
            if (!dateKey) return;
            const series = valuesByMachine.get(machine);
            if (!series.has(dateKey)) {
                const rawValue = row[pIdx];
                const value = rawValue === '' || rawValue === null || rawValue === undefined ? NaN : parseFloat(rawValue);
                series.set(dateKey, Number.isFinite(value) ? value : null);
            }
            allLabels.add(dateKey);
        });

        const sortedLabels = Array.from(allLabels).sort();
        const hasDG = selectedMachines.some(m => !String(m).toUpperCase().includes('EG'));
        const hasEG = selectedMachines.some(m => String(m).toUpperCase().includes('EG'));
        const limitGroups = [];
        if (hasDG) limitGroups.push({ limits: rawData.dgLimits, prefix: hasEG ? '柴油機' : '', color: '#dc3545' });
        if (hasEG) limitGroups.push({ limits: rawData.egLimits, prefix: hasDG ? '緊急發電機' : '', color: '#fd7e14' });

        let datasets = selectedMachines.map((machine, index) => ({
            label: machine,
            data: sortedLabels.map(label => valuesByMachine.get(machine).has(label) ? valuesByMachine.get(machine).get(label) : null),
            borderColor: LINE_COLORS[index % LINE_COLORS.length],
            backgroundColor: LINE_COLORS[index % LINE_COLORS.length],
            borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1, spanGaps: false
        }));

        limitGroups.forEach(group => {
            const lower = group.limits && group.limits.lower ? parseFloat(group.limits.lower[pIdx]) : NaN;
            const upper = group.limits && group.limits.upper ? parseFloat(group.limits.upper[pIdx]) : NaN;
            const prefix = group.prefix ? group.prefix + ' ' : '';
            if (!isNaN(upper)) datasets.push({
                label: prefix + '上限', data: new Array(sortedLabels.length).fill(upper),
                borderColor: group.color, borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false
            });
            if (!isNaN(lower)) datasets.push({
                label: prefix + '下限', data: new Array(sortedLabels.length).fill(lower),
                borderColor: group.color, borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false
            });
        });

        const ctx = document.getElementById('historyChart').getContext('2d');
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const gridColor = isDark ? '#444' : '#ddd';
        const textColor = isDark ? '#eee' : '#666';
        const config = {
            type: 'line',
            data: { labels: sortedLabels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                animation: false,
                scales: {
                    y: { beginAtZero: false, grid: {color: gridColor}, ticks: {color: textColor} },
                    x: { grid: {color: gridColor}, ticks: {color: textColor, maxTicksLimit: 12, maxRotation: 0} }
                },
                plugins: { legend: { labels: { color: textColor } } }
            }
        };
        if (chartInstance) {
            chartInstance.data = config.data;
            chartInstance.options = config.options;
            chartInstance.update('none');
        } else {
            chartInstance = new Chart(ctx, config);
        }
    }
</script>

</body>
</html>
